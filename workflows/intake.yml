name: Forecast intake
on:
  issues:
    types: [opened, edited, reopened]
  schedule:
    - cron: '37 * * * *'
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Specific issue number, or blank to reconcile all open forecast issues'
        required: false
        type: string
permissions:
  contents: write
  issues: write
concurrency:
  group: repo-write
  queue: max
  cancel-in-progress: false
jobs:
  intake:
    if: github.event_name != 'issues' || (startsWith(github.event.issue.title, 'forecast') && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate, register, push, and acknowledge; recover open unprocessed issues
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: python process_issues.py
      - name: Preserve pending data on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: intake-recovery-${{ github.run_id }}
          path: |
            registry
            state
          retention-days: 7

name: Hourly collector
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Revisit retained source history; deduplicate existing observations'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: repo-write
  queue: max
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect
        id: collect
        continue-on-error: true
        env:
          BACKFILL: ${{ inputs.backfill }}
        run: |
          args=()
          if [ "$BACKFILL" = true ]; then args+=(--backfill); fi
          python collector.py "${args[@]}"
      - name: Persist completed series and failure diagnostics
        if: always()
        run: bash scripts/commit_push.sh data state registry/frozen
      - name: Fail after preserving a partial run
        if: steps.collect.outcome == 'failure'
        run: exit 1
      - name: Preserve data on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collector-recovery-${{ github.run_id }}
          path: |
            data
            state
            registry/frozen
          retention-days: 7

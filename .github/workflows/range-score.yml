name: Range scoring
run-name: ${{ inputs.trigger == 'recovery' && format('Range scoring recovery {0} via {1}', inputs.slot, inputs.origin) || '' }}
# Hourly maturity scoring of the desk's range stream (desk/range_job.py score; since repo 2.17).
# Independent of forecast generation: it scores forecasts already registered, whatever the forecast workflow
# or its tests are doing. The repository scorer (scoring.py) requires complete, aligned Binance BTCUSDT
# perpetual 1m coverage of each window, retains the bars as evidence (registry/evidence/), and is idempotent
# by forecast id and frozen hash; missing observations stay pending and are retried, never scored as a loss.
# The weekly report scores the issue-intake streams and summarises; it does not score range forecasts.
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      # Repo 2.25: set only by the recovery dispatcher (recovery.py); provenance.py credits recovery only when the
      # dispatch came from github-actions[bot]. Leave blank when running by hand.
      trigger:
        description: 'Automation only (recovery dispatcher); leave blank'
        required: false
        type: string
        default: ''
      slot:
        description: 'Automation only: the decision or hour this recovery run is for'
        required: false
        type: string
        default: ''
      origin:
        description: 'Automation only: the dispatcher run and its trigger'
        required: false
        type: string
        default: ''
permissions:
  contents: write
jobs:
  score:
    runs-on: ubuntu-latest
    env:
      DESK_DISPATCH_TRIGGER: ${{ inputs.trigger }}
      DESK_DISPATCH_SLOT: ${{ inputs.slot }}
      DESK_DISPATCH_ORIGIN: ${{ inputs.origin }}
    timeout-minutes: 15
    # Shares the repository-write queue with the collector, forecast, intake and report jobs.
    concurrency:
      group: repo-write
      queue: max
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Score matured range forecasts and refresh the status
        id: score
        continue-on-error: true
        run: python desk/range_job.py score
      - name: Persist scores, evidence, the scoring log and the status
        if: always()
        env:
          DESK_DEPLOY_KEY: ${{ secrets.DESK_DEPLOY_KEY }}   # write deploy key; unset = workflow token (scripts/commit_push.sh)
          DESK_WRITER: range-score                                   # scripts/writers.json: the outputs this job may push
          DESK_META_TOKEN: ${{ github.token }}             # authenticated host-key lookup (scripts/github_host_keys.py)
          COMMIT_MESSAGE: Range scores
          PERSIST_BUDGET_S: '120'
        run: bash scripts/commit_push.sh registry/scores.jsonl registry/evidence state/range_scoring.jsonl reports/range.md reports/range_status.json
      - name: Fail if scoring failed
        if: steps.score.outcome == 'failure'
        run: exit 1

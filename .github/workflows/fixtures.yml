name: Regression and numerical fixtures
on:
  # desk/** covers the calendar, release manifest, fits and retained research artifacts (bot pushes made with
  # GITHUB_TOKEN do not trigger workflows, so the range job's own data commits do not re-run this).
  push:
    paths: ['**.py', 'scripts/**', '.github/workflows/**', 'desk/**', 'SHA256SUMS']
  pull_request:
    paths: ['**.py', 'scripts/**', '.github/workflows/**', 'desk/**', 'SHA256SUMS']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python test_fixtures.py
      - run: python -m unittest discover -s regression -v

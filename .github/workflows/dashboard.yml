name: Research dashboard
on:
  push:
    branches: [main]
    paths: ['reports/market_study_health.json', 'dashboard/**', 'scripts/build_dashboard.py', 'scripts/pages_collision.cjs', 'scripts/pages_collision.test.cjs', 'market_study_ops.py', 'market_study_ops.json', 'regression/test_market_study_ops.py', 'regression/test_dashboard.py', '.github/workflows/dashboard.yml']
  pull_request:
    paths: ['dashboard/**', 'scripts/build_dashboard.py', 'scripts/pages_collision.cjs', 'scripts/pages_collision.test.cjs', 'market_study_ops.py', 'market_study_ops.json', 'regression/test_market_study_ops.py', 'regression/test_dashboard.py', '.github/workflows/dashboard.yml']
  # Data commits made with GITHUB_TOKEN do not trigger push workflows.
  # Completion events and the fallback schedule keep the snapshot refreshed.
  workflow_run:
    workflows: ['Research lab', 'Range scoring', 'Research streams']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dashboard-${{ github.event.pull_request.number || 'production' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          # A workflow_run build always reads trusted main, never its trigger's artifacts/code.
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      # Action runtimes (repo 2.23): setup-node v6, upload-pages-artifact v5 (composite; pins
      # upload-artifact v7.0.0) and deploy-pages v5 all run on node24. node-version selects the
      # runtime for the dashboard's own tests, not the actions' runtime.
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Validate snapshot and expiry semantics
        run: |
          python -m unittest regression.test_dashboard -v
          node --test dashboard/model.test.mjs scripts/pages_collision.test.cjs
          node --check dashboard/app.js
      - name: Build immutable source snapshot
        run: python scripts/build_dashboard.py
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .dashboard-build
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      checks: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          # The helper is the exact trusted revision for this run, never a triggering artifact.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Deploy research desk
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Classify Pages creation collision
        id: collision
        if: steps.deployment.outcome == 'failure' && steps.deployment.outputs.page_url == ''
        uses: actions/github-script@v8
        with:
          script: |
            const {classify} = require('./scripts/pages_collision.cjs');
            core.setOutput('retry', await classify({github, context, core}));
      - name: Retry the same Pages artifact once
        id: retry
        if: steps.collision.outputs.retry == 'true'
        uses: actions/deploy-pages@v5
      - name: Require a successful deployment
        if: always()
        env:
          FIRST: ${{ steps.deployment.outcome }}
          RETRY: ${{ steps.retry.outcome }}
        run: test "$FIRST" = success || test "$RETRY" = success

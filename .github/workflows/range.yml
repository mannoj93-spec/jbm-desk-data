name: Range forecasts
# Crypto-desk range stream (desk/, package 12.1, repo 2.16): contract RC1D (desk/range_contract.py).
# One run = one attempt for the last 4H close: prepare and freeze a batch of three forecasts in one
# transaction (range_job.py forecast), push it, confirm the push on the remote BEFORE the window starts
# (range_job.py confirm), push the confirmation. Every attempt, whatever its outcome, is logged in
# state/range_attempts.jsonl; reports/range_status.json reconciles expected decisions with outcomes.
on:
  schedule:
    - cron: '2 0,4,8,12,16,20 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Shares the repository-write queue with the collector, intake and report jobs.
    concurrency:
      group: repo-write
      queue: max
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Desk offline tests and release drift check (refuse to forecast from untested code)
        run: |
          cd desk
          python make_release.py check
          for t in test_jbm_measure test_jbm_archive test_range_model test_range_contract test_range_job test_hardening test_release; do
            PYTHONDONTWRITEBYTECODE=1 python "$t.py"
          done
      - name: Monthly fit (validate the month's fit; build it once when a new month begins)
        timeout-minutes: 10
        run: python desk/range_job.py refit
      - name: Forecast (prepare, validate, freeze, register - one transaction)
        id: forecast
        continue-on-error: true
        run: python desk/range_job.py forecast
      - name: Status before publication
        if: always()
        run: python desk/range_job.py status
      # A failed attempt persists only its attempt record (and any input bundle): registration either
      # completed or left nothing behind, by construction (registration.register_batch).
      - name: Publish the batch (or the failure record)
        id: publish
        if: always()
        env:
          COMMIT_MESSAGE: Range forecasts
          PERSIST_BUDGET_S: '100'
        run: bash scripts/commit_push.sh registry state/forecast_manifest.json state/registered.json state/range_attempts.jsonl state/range_publications.jsonl desk/fits desk/inputs desk/calendars reports/range.md reports/range_status.json
      - name: Confirm publication on the remote (eligibility needs confirmation before the window starts)
        id: confirm
        if: steps.forecast.outcome == 'success' && steps.publish.outcome == 'success'
        run: python desk/range_job.py confirm
      - name: Status after confirmation
        if: always()
        run: python desk/range_job.py status
      - name: Persist the confirmation
        if: steps.confirm.outcome == 'success'
        env:
          COMMIT_MESSAGE: Range publication confirmed
          PERSIST_BUDGET_S: '60'
        run: bash scripts/commit_push.sh state/range_attempts.jsonl state/range_publications.jsonl reports/range.md reports/range_status.json
      - name: Fail if forecasting, publication or confirmation failed
        if: steps.forecast.outcome == 'failure' || steps.publish.outcome == 'failure' || steps.confirm.outcome == 'failure'
        run: exit 1

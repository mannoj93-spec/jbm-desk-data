# File name kept (collect.yml) so the workflow's run history, badge and dispatch URL carry over
# from the hourly collector it replaces. Schedule history lives in cadence.json.
name: Collector
on:
  schedule:
    # Every 15 minutes, off the quarter-hour. GitHub starts scheduled runs late (typically
    # minutes, sometimes more) and may drop some under load; report.py counts starts against
    # slots and never infers a slot from a start time. Keep cadence.json in step with this line.
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      backfill:
        description: 'Revisit retained source history; deduplicate existing observations'
        type: boolean
        default: false
permissions:
  contents: write
# Backlog control. Scheduled runs share one group with GitHub's default queue: at most one
# running and one pending, and a newer pending run cancels the older pending one. During an
# outage or a long backfill, obsolete scheduled runs are therefore dropped instead of piling up;
# a run already running is never cancelled. Manual and backfill runs have their own groups, so a
# scheduled run never cancels a manual check.
concurrency:
  group: collector-${{ github.event_name == 'schedule' && 'scheduled' || (inputs.backfill && 'backfill' || 'manual') }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    # Routine: 14-minute job limit = setup (~1) + collection step (11: 10-minute network
    # budget + writing) + persistence (bounded at 100 s by commit_push.sh). Backfill: 45 with a
    # 30-minute budget. Time waiting for repo-write does not count against the limit.
    timeout-minutes: ${{ inputs.backfill && 45 || 14 }}
    # Every repository writer (collector, backfill, forecast intake, weekly report) holds
    # repo-write while it runs; queue: max keeps up to 100 waiting jobs, so intake and report
    # work is never dropped behind collector runs.
    concurrency:
      group: repo-write
      queue: max
      cancel-in-progress: false
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect
        id: collect
        continue-on-error: true
        timeout-minutes: ${{ inputs.backfill && 35 || 11 }}
        env:
          BACKFILL: ${{ inputs.backfill }}
          COLLECTOR_BUDGET_S: ${{ inputs.backfill && '1800' || '600' }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: |
          args=()
          if [ "$BACKFILL" = true ]; then args+=(--backfill); fi
          python collector.py "${args[@]}"
      - name: Persist completed series and failure diagnostics
        if: always()
        timeout-minutes: 2
        env:
          PERSIST_BUDGET_S: '100'
        run: bash scripts/commit_push.sh data state registry/frozen
      - name: Fail after preserving a partial run
        if: steps.collect.outcome == 'failure'
        run: exit 1
      - name: Preserve data on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: collector-recovery-${{ github.run_id }}
          path: |
            data
            state
            registry/frozen
          retention-days: 7

name: Market studies
run-name: ${{ inputs.trigger == 'recovery' && format('Market studies recovery {0} via {1}', inputs.slot, inputs.origin) || github.event_name == 'workflow_run' && format('Market studies after run {0} attempt {1}', github.event.workflow_run.id, github.event.workflow_run.run_attempt) || '' }}
on:
  workflow_run:
    workflows: ["Collector", "Range forecasts"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: '12,27,42,57 * * * *'
  workflow_dispatch:
    inputs:
      trigger:
        description: 'Automation only; leave blank when running manually'
        type: string
        default: ''
      slot:
        description: 'Automation only: recovery opportunity'
        type: string
        default: ''
      origin:
        description: 'Automation only: recovery lineage'
        type: string
        default: ''
permissions:
  contents: write
jobs:
  studies:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    concurrency:
      group: repo-write
      queue: max
      cancel-in-progress: false
    env:
      DESK_DISPATCH_TRIGGER: ${{ inputs.trigger }}
      DESK_DISPATCH_SLOT: ${{ inputs.slot }}
      DESK_DISPATCH_ORIGIN: ${{ inputs.origin }}
      PYTHONDONTWRITEBYTECODE: '1'
      PERSIST_BUDGET_S: '90'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify the study runtime
        run: python -m unittest regression.test_market_studies regression.test_state_v2 -v
      - name: Prepare immutable opportunities and training artifacts
        id: prepare
        run: python -m research_tools.market_studies prepare
      - name: Prepare separately registered state v2
        id: state_prepare
        continue-on-error: true
        run: python -m research_tools.state_v2 prepare
      - name: Publish before observing outcomes or capturing execution quotes
        id: publish
        env:
          DESK_WRITER: market-studies
          DESK_DEPLOY_KEY: ${{ secrets.DESK_DEPLOY_KEY }}
          DESK_META_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: Register market study opportunities
        run: bash scripts/commit_push.sh streams/market-studies
      - name: Confirm exact records and implementation on main
        id: confirm
        run: python -m research_tools.market_studies confirm
      - name: Confirm state v2 on its own publication clock
        id: state_confirm
        continue-on-error: true
        run: python -m research_tools.state_v2 confirm
      - name: Execute independent paper sizing accounts
        id: execute
        continue-on-error: true
        run: python -m research_tools.market_studies execute
      - name: Collect capability and revision pilots
        id: collect
        continue-on-error: true
        run: python -m research_tools.market_studies collect
      - name: Score matured paired outcomes
        id: score
        continue-on-error: true
        run: python -m research_tools.market_studies score
      - name: Publish the research report
        id: report
        continue-on-error: true
        run: python -m research_tools.market_studies report
      - name: Score state v2 outcomes
        id: state_score
        continue-on-error: true
        run: python -m research_tools.state_v2 score
      - name: Report state v2 separately
        id: state_report
        continue-on-error: true
        run: python -m research_tools.state_v2 report
      - name: Report operational coverage without changing research evidence
        id: health
        if: always()
        continue-on-error: true
        run: python market_study_ops.py report
      - name: Persist records including failures
        id: persist
        if: always()
        env:
          DESK_WRITER: market-studies
          DESK_DEPLOY_KEY: ${{ secrets.DESK_DEPLOY_KEY }}
          DESK_META_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: Market study evidence and coverage
        run: bash scripts/commit_push.sh streams/market-studies reports/market_studies.json reports/market_studies.md reports/market_study_health.json reports/market_study_health.md reports/market_state_v2.json reports/market_state_v2.md
      - name: Require every stage
        if: always()
        env:
          PREPARE: ${{ steps.prepare.outcome }}
          PUBLISH: ${{ steps.publish.outcome }}
          CONFIRM: ${{ steps.confirm.outcome }}
          EXECUTE: ${{ steps.execute.outcome }}
          COLLECT: ${{ steps.collect.outcome }}
          SCORE: ${{ steps.score.outcome }}
          REPORT: ${{ steps.report.outcome }}
          PERSIST: ${{ steps.persist.outcome }}
          STATE_PREPARE: ${{ steps.state_prepare.outcome }}
          STATE_CONFIRM: ${{ steps.state_confirm.outcome }}
          STATE_SCORE: ${{ steps.state_score.outcome }}
          STATE_REPORT: ${{ steps.state_report.outcome }}
          HEALTH: ${{ steps.health.outcome }}
        run: |
          for result in "$PREPARE" "$PUBLISH" "$CONFIRM" "$EXECUTE" "$COLLECT" "$SCORE" "$REPORT" "$PERSIST" "$HEALTH" "$STATE_PREPARE" "$STATE_CONFIRM" "$STATE_SCORE" "$STATE_REPORT"; do
            test "$result" = success || exit 1
          done

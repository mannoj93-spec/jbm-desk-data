name: Month-end range source readiness
on:
  schedule:
    - cron: '37 22 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: range-source-readiness
  cancel-in-progress: true
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check closed archive history around the month boundary
        run: python range_source_repair.py readiness

name: Release check
# PROBE BRANCH ONLY (ruleset verification, repo 2.24.1). Never merged. Two pushes to this branch:
#   1. deploy-key push through scripts/commit_push.sh - must land (deploy keys bypass the ruleset);
#   2. workflow-token push - must be refused once the probe ruleset is active (and lands without it).
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Deploy-key push (must land)
        env:
          DESK_DEPLOY_KEY: ${{ secrets.DESK_DEPLOY_KEY }}
        run: |
          test -n "$DESK_DEPLOY_KEY" || { echo "::error::secret DESK_DEPLOY_KEY is not set"; exit 1; }
          git -c user.name=collector-bot -c user.email=collector-bot@users.noreply.github.com commit -q --allow-empty -m "ruleset probe: deploy-key push"
          bash scripts/commit_push.sh
      - name: Workflow-token push (refused while the ruleset is active)
        id: token
        continue-on-error: true
        run: |
          git -c user.name=collector-bot -c user.email=collector-bot@users.noreply.github.com commit -q --allow-empty -m "ruleset probe: workflow-token push"
          git push origin HEAD:ruleset-probe
      - name: Summary
        run: echo "deploy-key push landed; workflow-token push outcome = ${{ steps.token.outcome }}"

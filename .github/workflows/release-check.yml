name: Release check
# Repo 2.23: SHA256SUMS must verify and list exactly the maintained scope (scripts/check_checksums.py), and the
# release identity in desk/release.json must match the modules (desk/make_release.py check). Path filters cover every
# maintained file and the manifest; collector and stream data are excluded (bot pushes do not trigger workflows
# either). The required check of the main-branch ruleset (check context "release"; data workflows bypass it with
# the deploy key - docs/OPERATIONS.md "Release gate"). Repo 2.24: pull requests always run it - a required check
# that a path filter skips would leave a PR waiting forever.
on:
  push:
    branches: [main]
    paths: ['**', '!data/**', '!streams/**', '!state/**', '!reports/**', '!research/**', '!desk/inputs/**', '!desk/fits/**', '!registry/**', '!tests/**', '!desk/deployments.jsonl']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    uses: ./.github/workflows/fixtures.yml
  release:
    needs: tests
    # Keep the required context explicitly red even when its prerequisite failed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the complete regression suite
        env:
          TEST_RESULT: ${{ needs.tests.result }}
        run: test "$TEST_RESULT" = success
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Checksums (verify hashes and scope)
        run: python scripts/check_checksums.py check
      - name: Release identity
        working-directory: desk
        run: python make_release.py check
      - name: Checker regression
        run: python -m unittest regression.test_checksums -v

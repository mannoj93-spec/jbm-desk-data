name: Collector watchdog
on:
  schedule:
    # Every 30 minutes. With the 90-minute stale limit, a collector that stops is reported about
    # 90-120 minutes after its last run, plus however late GitHub starts this check.
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      stale_minutes:
        description: 'Minutes without a scheduled run before the collector is stale (blank = repository variable or 90)'
        required: false
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: collector-watchdog
  cancel-in-progress: true
jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          # Only run records and code are needed; skip the growing market-data files.
          sparse-checkout: data/runs
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check for a stale, missing, or failing collector
        env:
          WATCHDOG_STALE_MIN: ${{ inputs.stale_minutes || vars.WATCHDOG_STALE_MIN || '90' }}
        run: python watchdog.py
      - name: Check external timer arrivals (primary trigger)
        # Repo 2.30.9: the external timer starts almost every collector run, so its silence is the alert. This
        # step fails when no external arrival is on record for more than 45 minutes, or the arrivals cannot be
        # read. It is only as timely as this workflow's own native schedule.
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python health.py --timer-check
